[tool.poetry]
name = "goldlens"
version = "0.1.0"
description = "Carry-adjusted relative-value analytics on MCX gold futures"
authors = ["AI <ai@example.com>"]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pandas = "^2.2.0"
numpy = "^1.26.0"
scipy = "^1.11.0"
statsmodels = "^0.14.0"
httpx = "^0.27.0"
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"
duckdb = "^0.10.0"
plotly = "^5.18.0"
streamlit = "^1.32.0"
structlog = "^24.1.0"
typer = "^0.9.0"
PyYAML = "^6.0"
tenacity = "^8.2.0"
jinja2 = "^3.1.0"
pdfkit = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
hypothesis = "^6.98.0"
ruff = "^0.3.0"
mypy = "^1.8.0"
pre-commit = "^3.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
ignore_missing_imports = true
